name: firulais-legacy

services:
  app:
    image: firulais-legacy-app:local
    build:
      context: .
      dockerfile: Dockerfile.old
    container_name: firulais-legacy-app
    ports:
      - "8000:8000"
      - "3306:3306"
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: firulais
      DB_USER: firulais
      DB_PASSWORD: firulais
      DUMP_PATH: /dumps/firulais-mysql-dump.sql
    volumes:
      - mysql_old_data:/var/lib/mysql
      - ./dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    container_name: firulais-legacy-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: app
      PMA_PORT: 3306
      PMA_USER: firulais
      PMA_PASSWORD: firulais
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_old_data:
